<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>领榜 · 助力活动双视角</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#2a493a;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{display:flex;justify-content:center;gap:56px;padding:28px 22px}.panel{width:286px;padding-top:15px}.brand{font-size:11px;letter-spacing:2px;color:#849b8b}h1{font-size:26px;line-height:1.5;font-weight:600;margin:15px 0 12px}.panel>p{font-size:12px;line-height:1.9;color:#82968a}h2{font-size:12px;font-weight:500;color:#789381;margin:25px 0 10px}.scene{display:block;width:100%;text-align:left;border:1px solid #dce6df;background:#ffffff9e;border-radius:9px;padding:12px 14px;margin-bottom:8px;color:#607d6b;cursor:pointer;font:inherit;font-size:12px}.scene.active{background:#fff;border-color:#83b69a;color:#21633f;box-shadow:0 3px 10px #527f5f09}.scene i{font-style:normal;font-size:10px;opacity:.55;margin-right:11px}.tip{border-top:1px solid #dce5df;padding-top:18px;margin-top:22px!important}.device{width:389px;height:min(826px,calc(100dvh - 56px));min-height:520px;border:7px solid #20372f;border-radius:35px;overflow:hidden;box-shadow:0 18px 60px #27473420;background:white;flex-shrink:0}iframe{display:block;border:0;width:100%;height:100%;background:#f4f7f8}.caption{font-size:11px;color:#8fa194;margin-top:13px;line-height:1.8}@media(max-width:760px){main{padding:14px 12px;display:block}.panel{width:100%;padding:0;margin-bottom:20px}h1{font-size:20px;margin:8px 0}.panel>p,.brand,.tip{display:none}.scenes{display:flex;flex-wrap:wrap;gap:6px}.scene{width:auto;margin:0;padding:8px;font-size:11px}.scene i{margin-right:5px}h2{margin:12px 0 7px}.device{margin:auto;width:min(389px,100%);height:812px;min-height:0}.caption{display:none}}.theme-note{display:block;margin:6px 0 0 22px;font-size:10px;color:#829487}.theme-note:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:#5c8b70}.coral-note:before{background:#dc8d7d}.navy-note:before{background:#42526a}@media(max-width:760px){.theme-note{margin-left:0;font-size:9px}}</style><main><aside class="panel"><div class="brand">领榜 · 助力活动</div><h1>两个视角<br>七个场景</h1><p>每位用户每个自然月仅能助力一次。成功助力才消耗次数，全部需求共享。</p><h2>发起者</h2><div class="scenes"><button class="scene active" data-scene="start" onclick="switchScene(this)"><i>01</i>发起助力</button><button class="scene" data-scene="progress" onclick="switchScene(this)"><i>02</i>助力中 · 已有 2 位好友助力</button><button class="scene" data-scene="ready" onclick="switchScene(this)"><i>03</i>助力成功 · 3 人已集齐</button><button class="scene" data-scene="expired" onclick="switchScene(this)"><i>04</i>助力失败 · 24 小时未集齐</button></div><h2>助力者</h2><div class="scenes"><button class="scene" data-scene="helper-success" onclick="switchScene(this)"><i>05</i>助力成功 · 新用户<small class="theme-note green-note">米白绿 · 简约品牌</small></button><button class="scene" data-scene="helper-already" onclick="switchScene(this)"><i>06</i>此次需求已助力过 · 老用户<small class="theme-note coral-note">珊瑚红 · 温暖邀约</small></button><button class="scene" data-scene="helper-quota" onclick="switchScene(this)"><i>07</i>助力失败 · 本月次数已用尽 · 老用户<small class="theme-note navy-note">深蓝金 · 质感礼遇</small></button></div><p class="tip">新用户：点击微信卡片 → 地理位置授权 → 手机号授权登录 → 活动页 → 助力成功。<br><br>老用户：点击微信卡片 → 直接进入活动页，展示已助力或次数用尽。<br><br>活动规则在页面内展示，结果页可返回小程序首页。<br><br>场景选择位于手机外，手机内只展示产品页面。</p><div class="caption">每次切换重置当前场景。身份、手机号及状态为本地预设，未连接真实微信和服务端。</div></aside><section class="device"><iframe id="prototype" title="领榜助力活动" src="prototype.html?scene=start"></iframe></section></main><script>function switchScene(b){document.querySelectorAll('.scene').forEach(n=>n.classList.toggle('active',n===b));document.getElementById('prototype').src='prototype.html?scene='+b.dataset.scene;history.replaceState(null,'','#'+b.dataset.scene)}const selected=document.querySelector('[data-scene="'+location.hash.slice(1).replace(/[^a-z-]/g,'')+'"]');if(selected)switchScene(selected)</script></html>
