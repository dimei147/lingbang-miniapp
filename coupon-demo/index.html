amp,valid_until_display:endDisplay,operator:'运营管理员'});r.stats.issued+=n;if(!hadUser)r.stats.people++;log(r,'手动发券',`发放单 ${id}；用户 ${u.id}；${n} 张`);persist();render();$('grantReceipt').textContent=`发放成功：${u.name}（${u.id}）获得 ${n} 张${r.display_name}。发放单号：${id}，有效期至 ${endDisplay}。`;$('grantReceipt').hidden=false;toast(`已成功发放 ${n} 张优惠券`);selectedUserId='';$('userResults').innerHTML='';$('grantUserQuery').value='';grantBusy=false;grantSummary()})};

const ISSUE_SOURCES={MANUAL:'手动发券',ACTIVITY:'活动发放',SYSTEM:'系统发放',REFUND_RETURN:'退款退回'};
const COUPON_STATES={PENDING:'待生效',AVAILABLE:'待使用',LOCKED:'支付锁定',USED:'已使用',EXPIRED:'已过期',VOID:'已作废'};
let couponQuery={},couponPage=1;
function couponTime(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.getTime())?'—':new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(date)}
function allCouponDetails(templateId){return userCoupons.filter(c=>c.template_id===templateId).map(c=>{const grant=grantRecords.find(g=>g.id===c.grant_id);let state=c.status;if(['AVAILABLE','PENDING'].includes(state)){if(new Date(c.valid_until_at).getTime()<=Date.now())state='EXPIRED';else if(new Date(c.valid_from_at).getTime()<=Date.now())state='AVAILABLE'}return {...c,coupon_code:c.coupon_code||c.id,user_name:c.user_name||grant?.user_name||c.user_id,masked_phone:c.masked_phone||grant?.masked_phone||'—',source:c.source||'SYSTEM',source_name:c.source_name||(c.source==='MANUAL'?'后台手动发券':'系统发放'),operator:c.operator||grant?.operator||'系统',state}}).sort((a,b)=>new Date(b.issued_at)-new Date(a.issued_at)||String(b.coupon_code).localeCompare(String(a.coupon_code)))}
function initializeCouponHistory(){
 if(historySchema>=1)return;
 for(const r of records){
  const existing=userCoupons.filter(c=>c.template_id===r.id&&c.source!=='REFUND_RETURN'),manual=grantRecords.filter(g=>g.template_id===r.id),count=Math.max(0,r.stats.issued-existing.length),manualPeople=new Set(manual.map(g=>g.user_id)).size,people=Math.max(1,r.stats.people-manualPeople),originals=[];
  const base=r.validity_type==='FIXED_RANGE'?new Date(r.valid_from_at+'+08:00').getTime():new Date(r.created_at.replace(' ','T')+'+08:00').getTime();
  for(let i=0;i<count;i++){
   const userIndex=i%people,issued=new Date(base+((i%240)+1)*60000),expired=i>=r.stats.uses&&i<r.stats.uses+r.stats.expired;
   // Historical instances may have been issued before current seed creation dates; keep expiry and elapsed days consistent.
   const until=r.validity_type==='FIXED_RANGE'?new Date(r.valid_until_at+'+08:00'):expired?new Date(Date.now()-86400000-(i%5)*3600000):new Date(issued.getTime()+r.valid_days*86400000);
   const actualIssued=r.validity_type==='AFTER_ISSUED'&&expired?new Date(until.getTime()-r.valid_days*86400000):issued;
   const source=[1002,1003,1006,1008].includes(r.id)?'ACTIVITY':i%4===0?'SYSTEM':'MANUAL',id='CP'+r.id+String(i+1).padStart(6,'0'),uid='H'+r.id+String(userIndex+1).padStart(5,'0'),parent=r.scope.every(v=>v!=='TEACHER_SERVICE_FEE');
   const c={id,coupon_code:id,template_id:r.id,user_id:uid,user_name:(parent?'家长':'老师')+String(userIndex+1).padStart(3,'0'),masked_phone:'199****'+String(userIndex+1).padStart(4,'0'),grant_id:'HG'+r.id+String(i+1).padStart(6,'0'),source,source_name:source==='ACTIVITY'?r.internal_name.replace(/\d+元券$/,'')+'活动':source==='MANUAL'?'后台手动发券':'用户福利发放',source_ref:source==='ACTIVITY'?'ACT'+r.id:'',operator:source==='MANUAL'?'运营管理员':'系统',issued_at:actualIssued.toISOString(),valid_from_at:(r.validity_type==='FIXED_RANGE'?new Date(base):actualIssued).toISOString(),valid_until_at:until.toISOString(),status:i<r.stats.uses?'USED':expired?'EXPIRED':'AVAILABLE',order_id:i<r.stats.uses?'ORD'+r.id+String(i+1).padStart(6,'0'):null,refund_return_policy:'FULL_REFUND_SUCCESS',return_validity_policy:'KEEP_ORIGINAL'};
   originals.push(c);userCoupons.push(c);
  }
  for(let i=0;i<r.stats.returned;i++){
   const original=originals[i]||existing[i];if(!original)continue;original.status='USED';original.order_id=original.order_id||'ORD'+r.id+String(i+1).padStart(6,'0');const id='RC'+r.id+String(i+1).padStart(6,'0'),returnedAt=new Date(Math.min(Date.now()-3600000,new Date(original.issued_at).getTime()+86400000));
   userCoupons.push({...original,id,coupon_code:id,source:'REFUND_RETURN',source_name:'全额退款退回',source_ref:'RF'+r.id+String(i+1).padStart(6,'0'),operator:'系统',grant_id:'RG'+r.id+String(i+1).padStart(6,'0'),issued_at:returnedAt.toISOString(),valid_from_at:returnedAt.toISOString(),status:new Date(original.valid_until_at).getTime()<=Date.now()?'EXPIRED':'AVAILABLE',return_of_coupon_id:original.id,original_coupon_code:original.coupon_code||original.id,refund_id:'RF'+r.id+String(i+1).padStart(6,'0'),order_id:original.order_id});
  }
 }
 historySchema=1;persist();
}
function selectedCouponDetails(){return allCouponDetails(detailId).filter(c=>(!couponQuery.source||c.source===couponQuery.source)&&(!couponQuery.status||c.state===couponQuery.status)&&(!couponQuery.keyword||[c.coupon_code,c.user_id,c.user_name,c.masked_phone,c.grant_id,c.source_name,c.source_ref,c.order_id,c.refund_id,c.original_coupon_code].join(' ').toLowerCase().includes(couponQuery.keyword.toLowerCase())))}
function couponDetailsPanel(id){const all=allCouponDetails(id),returns=all.filter(c=>c.source==='REFUND_RETURN');return `<form id="couponFilters" class="coupon-filters"><div class="form-item"><label for="couponKeyword">券码 / 用户 / 业务单号</label><input class="control" id="couponKeyword" placeholder="请输入券码、用户信息或业务单号" value="${esc(couponQuery.keyword||'')}"></div><div class="form-item"><label for="couponSource">发券来源</label><select class="control" id="couponSource"><option value="">全部来源</option>${options(ISSUE_SOURCES,couponQuery.source)}</select></div><div class="form-item"><label for="couponStatus">券状态</label><select class="control" id="couponStatus"><option value="">全部状态</option>${options(COUPON_STATES,couponQuery.status)}</select></div><div class="coupon-filter-actions"><button type="button" class="btn" id="resetCouponFilters">重置</button><button class="btn primary" type="submit">查询</button></div></form><div class="coupon-summary"><strong>累计发券 ${all.length} 张 · 退款退回 ${returns.length} 张</strong></div><div class="table-wrap"><table class="coupon-ledger"><thead><tr><th>券码 / 发放单号</th><th>用户</th><th>来源 / 关联业务</th><th>发放时间</th><th>状态</th><th>使用有效期</th><th>原券码 / 退款单</th><th>操作人</th></tr></thead><tbody id="couponRows"></tbody></table></div><div class="coupon-pagination" id="couponPager"></div>`}
function renderCouponRows(){if(detailTab!=='grants'||!$('couponRows'))return;const rows=selectedCouponDetails(),size=10,max=Math.max(1,Math.ceil(rows.length/size));couponPage=Math.max(1,Math.min(couponPage,max));$('couponRows').innerHTML=rows.slice((couponPage-1)*size,couponPage*size).map(c=>`<tr><td>${esc(c.coupon_code)}<span class="subline">${esc(c.grant_id||'—')}</span></td><td>${esc(c.user_name)}<span class="subline">${esc(c.user_id)} · ${esc(c.masked_phone)}</span></td><td><span class="tag ${c.source==='REFUND_RETURN'?'gold':''}">${ISSUE_SOURCES[c.source]||'其他来源'}</span><span class="subline">${esc(c.source_name)}</span><span class="subline">${esc(c.source_ref||c.order_id||'')}</span></td><td>${couponTime(c.issued_at)}</td><td><span class="tag ${c.state==='AVAILABLE'?'green':c.state==='EXPIRED'?'gray':''}">${COUPON_STATES[c.state]||c.state}</span></td><td>${couponTime(c.valid_from_at)}<span class="subline">至 ${couponTime(c.valid_until_at)}</span></td><td>${esc(c.original_coupon_code||'—')}<span class="subline">${esc(c.refund_id||'')}</span></td><td>${esc(c.operator)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">暂无符合条件的发券明细</td></tr>';$('couponPager').innerHTML=`<span>共 ${rows.length} 张 · 每页 10 张</span><button class="page-btn" data-coupon-page="${couponPage-1}" ${couponPage===1?'disabled':''} aria-label="明细上一页">‹</button><span>${couponPage} / ${max}</span><button class="page-btn" data-coupon-page="${couponPage+1}" ${couponPage===max?'disabled':''} aria-label="明细下一页">›</button>`}
$('detailBody').addEventListener('submit',e=>{if(e.target.id!=='couponFilters')return;e.preventDefault();couponQuery={keyword:$('couponKeyword').value.trim(),source:$('couponSource').value,status:$('couponStatus').value};couponPage=1;renderCouponRows()});
initializeCouponHistory();
render();
</script></body></html>
